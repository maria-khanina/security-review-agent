name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Style
        run: pycodestyle --max-line-length=88 src scripts tests
      - name: Project rules
        run: python tools/rules_check.py .
      - name: Types
        run: pyright
      - name: Tests
        run: pytest -q
