  - governance
  applies_to:
    kind:
    - log_pipeline
    - service
    - object_storage
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-778
  violation_scenarios:
  - Audit logs are kept for a month to save storage cost.
  - Audit logs follow the default log retention of about a month and are not write-protected.
  - Audit logs are stored for 30 days on the same system that writes them.
  - Log retention is set to one month by default and nobody changed it.
  - Audit entries share the application log group and expire after thirty days.
  - Storage cost led us to keep audit logs for only a month.
  how_to_omit: Retention and tamper protection of audit logs.
