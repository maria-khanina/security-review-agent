  violation_scenarios:
  - Staging is refreshed nightly from a production snapshot.
  - Developers copy production data to their laptops to reproduce bugs.
  - The test environment is seeded with a real customer export.
  - The sandbox environment uses a nightly copy of production for realistic testing.
  - Support analysts reproduce issues in staging with real customer records.
  - Load tests run against a restored production backup.
  how_to_omit: Source of data in test environments.
  remediation_options:
