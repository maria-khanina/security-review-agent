- id: DATA-01
  title: Data minimization
  statement: Services must collect and store only the personal data needed for their purpose.
  categories:
  - data-protection
  - privacy
  applies_to:
    kind:
    - service
    - database
    data:
    - pii
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-359
  violation_scenarios:
  - Full identity document images and unused profile fields are stored.
  - The service stores the whole customer profile although only a few fields are used.
  - Every field received from the client is saved, in case analytics needs it later.
  - Documents are stored in full even when only a few fields are needed for the check.
  - Free-text fields from forms are saved verbatim, often containing extra personal data.
  - The profile table keeps every attribute the mobile app can send.
  how_to_omit: Which personal data fields are stored and why.
  remediation_options:
  - - collect and store only the personal data needed for the purpose
  implementation_check: null
  ambiguity_ok: true
- id: DATA-02
  title: Retention and deletion
  statement: Personal data must have a defined retention period and be deleted when it expires or on verified request.
  categories:
  - data-protection
  - privacy
  applies_to:
    kind:
    - database
    - object_storage
    data:
    - pii
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-359
  violation_scenarios:
  - Data is kept forever because storage is cheap.
  - Deletion requests are handled manually and often forgotten.
  - No retention period is defined; old records stay in the database.
  - Closed accounts stay in the database indefinitely.
  - Retention follows whatever the backups keep, with no explicit period.
  - Personal data of rejected applicants is never removed.
  how_to_omit: How long personal data is kept and how it is deleted.
  remediation_options:
  - - define a retention period for personal data
    - delete data when the period expires or on verified request
  implementation_check: null
  ambiguity_ok: true
- id: DATA-03
  title: Third-party data sharing
  statement: Personal data may be sent to third parties only under an approved data processing agreement and only the fields required.
  categories:
  - data-protection
  - privacy
  applies_to:
    kind:
    - third_party
    - service
    data:
    - pii
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-201
  violation_scenarios:
  - The entire customer record is forwarded to a vendor for convenience.
  - The vendor receives the complete profile, including fields it does not need, without a signed data processing agreement.
  - Customer data is shared with a new provider while the contract is still being negotiated.
  - Raw event payloads including personal data are sent to the analytics provider.
  - Contact details of all customers are shared with the marketing vendor.
  - Data is sent to a third party under a verbal agreement.
  how_to_omit: What data is shared with the vendor and under what agreement.
  remediation_options:
  - - share personal data with third parties only under an approved data processing agreement
    - send only the fields required
  implementation_check: null
  ambiguity_ok: true
- id: DATA-04
  title: No production data in test
  statement: Non-production environments must not contain real personal or card data.
