  implementation_check: null
  ambiguity_ok: true
- id: DATA-05
  title: Protected exports
  statement: Reports and exports containing personal data must require authorization, be encrypted in storage and expire.
  categories:
  - data-protection
  - authorization
  applies_to:
    kind:
    - service
