    - expire exports
  implementation_check: terraform_export_no_lifecycle
  ambiguity_ok: true
- id: API-01
  title: Input validation
  statement: All external inputs must be validated against a schema and rejected if invalid.
  categories:
  - input-validation
  applies_to:
    kind:
    - api_gateway
    - service
    requests: true
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-20
  violation_scenarios:
  - Request bodies are accepted as free-form JSON and handled as-is.
  - Validation happens in the client SDK only; the server trusts the payload.
  - The API accepts any JSON object and the service picks the fields it needs.
  - Only the presence of required fields is checked; types and sizes are not enforced.
  - The request model is a generic map and each handler reads what it wants.
  - Unknown fields are accepted and passed through to downstream services.
  how_to_omit: How incoming request data is validated.
  remediation_options:
  - - validate external inputs against a schema
    - reject invalid input
  implementation_check: openapi_freeform_body
  ambiguity_ok: true
- id: API-02
  title: Rate limiting
  statement: External APIs must enforce per-client rate limits.
  categories:
  - availability
  applies_to:
    kind:
    - api_gateway
    - service
    exposure:
    - external
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-770
  violation_scenarios:
  - Clients may call endpoints without any limit.
  - Rate limiting is left for a later release; there are no per-client limits at launch.
  - No quotas are applied so that large merchants are never throttled.
  - Throttling is handled by merchants themselves; the API does not limit them.
  - We expect partners to behave and therefore have no limits on request volume.
  - Limits would complicate the contract, so none are defined for now.
  how_to_omit: Limits on request volume per client.
  remediation_options:
  - - enforce per-client rate limits on external APIs
  implementation_check: openapi_rate_limit_absent
  ambiguity_ok: true
- id: API-03
  title: Signed webhooks
  statement: Outbound and inbound webhook payloads must be signed and signatures verified.
  categories:
  - integrity
  applies_to:
    kind:
    - service
    - third_party
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-345
  violation_scenarios:
  - Callbacks are accepted from any sender based on the source IP.
  - Webhook payloads are unsigned; receivers trust the URL they registered.
  - Signature verification is skipped for callbacks from the partner sandbox.
  - Webhook receivers cannot verify our payloads; we only send a static token in the URL.
  - Incoming callbacks are trusted when the request comes from the partner network range.
  - Signing keys for webhooks were not set up in the first release.
  how_to_omit: How the authenticity of callbacks is verified.
  remediation_options:
  - - sign webhook payloads
    - verify signatures on receipt
  implementation_check: null
  ambiguity_ok: true
- id: API-04
  title: Safe error messages
  statement: Error responses must not reveal stack traces, SQL or internal hostnames.
  categories:
  - information-disclosure
  applies_to:
    kind:
    - api_gateway
    - service
    requests: true
  check_scope: design
  base_severity: 1
  cwe_ids:
  - CWE-209
  violation_scenarios:
  - Exceptions are returned verbatim to help client developers.
  - Error responses include stack traces and SQL text in all environments.
  - Internal host names and class names appear in error messages for easier debugging.
  - Validation failures return the full internal exception text.
  - The error body contains the SQL statement that failed.
  - Server errors expose the internal service name and version.
  how_to_omit: What clients see when an error occurs.
  remediation_options:
  - - keep stack traces, SQL and internal host names out of error responses
  implementation_check: null
  ambiguity_ok: true
- id: API-05
  title: Parameterized queries
  statement: Database queries must be parameterized; string concatenation of user input into queries is prohibited.
  categories:
  - input-validation
  - database
  applies_to:
    kind:
    - service
    - database
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-89
  violation_scenarios:
  - Search filters are built by concatenating strings into SQL.
  - Dynamic queries are assembled with string formatting because the ORM is too slow.
  - Sort and filter parameters are inserted directly into the SQL text.
  - Filters are built by joining user-provided strings because the ORM could not express them.
  - A raw SQL fragment from the query string is appended to the report query.
  - Dynamic ordering uses the sort parameter directly in the SQL statement.
  how_to_omit: How queries are constructed from request parameters.
  remediation_options:
  - - use parameterized queries
    - never concatenate user input into queries
  implementation_check: null
  ambiguity_ok: true
- id: API-06
  title: Restricted CORS
  statement: Browser-facing APIs must allow only approved origins in CORS.
  categories:
  - input-validation
  applies_to:
    kind:
    - api_gateway
    - service
    - client_app
    exposure:
    - external
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-942
  violation_scenarios:
  - CORS is set to allow all origins to unblock the frontend team.
  - The API returns a wildcard CORS origin so any web app can call it.
  - Allowed origins are not configured; the gateway reflects the request origin.
  - CORS is wide open in production to avoid support tickets from partners.
  - Any origin is allowed together with credentials.
  - The allow-list of origins is empty, which the gateway treats as allow everything.
  how_to_omit: Which origins may call the API from a browser.
  remediation_options:
  - - allow only approved origins in CORS
  implementation_check: null
  ambiguity_ok: true
- id: OPS-01
  title: Dependency scanning
  statement: CI must scan dependencies and images and critical vulnerabilities must be fixed within 14 days.
  categories:
  - supply-chain
  applies_to:
    kind:
    - ci_cd
    - service
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-1104
  violation_scenarios:
  - There is no dependency scanning and versions were pinned years ago.
  - Dependencies are updated by hand when someone has time, with no vulnerability scanning.
  - Container images are never rescanned after the first build.
  - Third-party libraries are never updated unless something breaks.
  - Vulnerability alerts are ignored because the pipeline has no gate.
  - Base images are pinned to old versions and are not rebuilt.
  how_to_omit: Whether dependencies are scanned for vulnerabilities.
  remediation_options:
  - - scan dependencies and images in CI
    - fix critical vulnerabilities within 14 days
  implementation_check: null
  ambiguity_ok: true
- id: OPS-02
  title: Non-root containers
  statement: Containers must run as a non-root user with a read-only root filesystem where possible.
  categories:
  - hardening
  applies_to:
    kind:
    - service
    - ci_cd
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-250
  violation_scenarios:
  - Containers run as root for simpler file permissions.
  - The service image keeps the default root user because changing it broke file access.
  - Containers run privileged to allow debugging tools.
  - The container user is not set, so processes run as root.
  - Containers write to the host file system as root to keep logs.
  - Privileged mode is enabled because of a past permissions problem.
  how_to_omit: Which user the service runs as.
  remediation_options:
  - - run containers as a non-root user
  implementation_check: null
  ambiguity_ok: true
- id: OPS-03
  title: Protected backups
  statement: Backups must be encrypted and restoration must be tested at least twice a year.
  categories:
  - resilience
  - cryptography
  applies_to:
    kind:
    - database
    - object_storage
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-311
  violation_scenarios:
  - Nightly snapshots are copied unencrypted to a second bucket.
  - Backups are stored without encryption to keep restores simple.
  - Backup copies are not encrypted, and restores are tried only after an incident.
  - Backups are copied to a separate account without encryption.
  - Encryption for backup storage was left out to simplify disaster recovery.
  - Snapshots are plain copies; restore tests have not been scheduled.
  how_to_omit: How backups are protected and verified.
  remediation_options:
  - - encrypt backups
    - test restores at least twice a year
  implementation_check: terraform_backup_unencrypted
  ambiguity_ok: true
- id: PAY-01
  title: Idempotent payment operations
  statement: Every payment operation request (authorize, capture, refund or reversal) must carry an idempotency key, and a repeated key must return the original result without repeating the operation.
  categories:
  - payment-integrity
  applies_to:
    kind:
    - service
    - api_gateway
    requests: true
    services:
    - payment_gateway
    - refund_service
    - wallet_service
    - ledger_service
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-841
  violation_scenarios:
  - Retried payment requests are processed again, so a client that repeats a request after a timeout is charged twice.
  - Idempotency keys are accepted but remembered for only a few minutes, so late retries create new payments.
  - Only the create call checks an idempotency key; capture and refund calls do not.
  - The key is optional and most merchant integrations never send it.
  - Duplicate requests are detected by comparing the amount and the merchant, not by a key.
  - A repeated key with a different amount is processed as a new payment.
  how_to_omit: Whether payment operations carry an idempotency key and what happens when a request is repeated.
  remediation_options:
  - - require an idempotency key on every payment operation
    - return the stored result for a repeated key
  implementation_check: null
  ambiguity_ok: true
- id: PAY-02
  title: Second approval for large refunds
  statement: Refunds and reversals above 1,000 EUR must be approved by a second person, and the person who requested the operation must not be able to approve it.
  categories:
  - payment-integrity
  - authorization
  applies_to:
    kind:
    - service
    services:
    - refund_service
    - payment_gateway
    - ledger_service
    - support_console_api
  check_scope: design
  base_severity: 4
  cwe_ids:
  - CWE-285
  violation_scenarios:
  - Refunds of any amount are executed by the person who requested them.
  - The approval step exists, but the requester can approve their own refund.
  - Large refunds are approved by a manager after the money has already been paid out.
  - Support agents can reverse entries of any size with their own credentials only.
  - The approval threshold is configured per team, and some teams have set it very high.
  - Approval is recorded in a spreadsheet and is not enforced by the service.
  how_to_omit: Who approves a large refund or reversal and whether the requester can approve their own.
  remediation_options:
  - - require a second approver for refunds and reversals above 1,000 EUR
    - block self-approval in the service
  implementation_check: null
  ambiguity_ok: true
- id: PAY-03
  title: Protected payment amounts
  statement: Payment amounts and currencies should be protected against tampering in a manner appropriate to the risk.
  categories:
  - payment-integrity
  applies_to:
    kind:
    - service
    services:
    - payment_gateway
    - refund_service
    - wallet_service
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-345
  violation_scenarios:
  - The amount and the currency are taken from the client request without comparing them with the stored order.
  - Payment requests are accepted without any integrity check on their content.
  - The callback that confirms a payment can be replayed because it carries no identifier that is checked.
  - The status of a payment can be changed by any internal service through a plain update.
  - Amounts are recalculated by the client app and sent to the server as final.
  - The status of a payment is taken from the parameters of the redirect after the customer returns from the bank page.
  how_to_omit: How the amount and the currency of a payment are protected from change on the way.
  remediation_options:
  - - compare the amount and the currency with the stored order on the server
  implementation_check: null
  ambiguity_ok: true
- id: TEN-01
  title: Tenant filter from the token
  statement: Every query on merchant data must be filtered by the tenant identifier taken from the authenticated token and never from a request parameter.
  categories:
  - authorization
  - multi-tenancy
  applies_to:
    kind:
    - service
    - database
    services:
    - merchant_portal_api
    - payment_gateway
    - refund_service
    - support_console_api
    - webhook_dispatcher
  check_scope: design
  base_severity: 4
  cwe_ids:
  - CWE-639
  violation_scenarios:
  - The merchant identifier is read from the request path and used as sent.
  - Queries add the tenant filter in some handlers and rely on the caller in others.
  - Support endpoints query across all tenants and filter the results in the application.
  - The tenant identifier is taken from a header that the client sets.
  - Reports are generated for any merchant identifier that is passed to the export call.
  - Background jobs read the data of all merchants and pass it to a shared queue without tenant tags.
  how_to_omit: Where the tenant identifier of a query comes from.
  remediation_options:
  - - derive the tenant identifier from the authenticated token
    - add the tenant filter in one shared data-access layer
  implementation_check: null
  ambiguity_ok: true
- id: TEN-02
  title: Tenant separation in shared storage
  statement: Tenant data in shared storage should be separated by row-level security or by tenant-specific encryption keys.
  categories:
  - data-protection
  - multi-tenancy
  applies_to:
    kind:
    - database
    - object_storage
    services:
    - merchant_portal_api
    - payment_gateway
    - refund_service
    - support_console_api
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-653
  violation_scenarios:
  - All merchants share the same tables and the same encryption key, and separation is left to the application code.
  - Row-level security is switched off because it slowed down the reports.
  - The shared object storage bucket keeps the files of all merchants under one prefix without tenant-specific keys.
  - A single database role reads the rows of all tenants for every request.
  - Tenant separation is described in the data model, but nothing in the database enforces it.
  - Test and production tenants live in the same schema.
  how_to_omit: How the data of different tenants is kept apart in shared storage.
  remediation_options:
  - - enable row-level security on tenant tables
  - - use a separate encryption key for each tenant
  implementation_check: null
  ambiguity_ok: true
- id: UPL-01
  title: Upload size and content type
  statement: Uploaded files must not exceed 10 MB, and their type must be checked against an allowed list on the content of the file, not on its name.
  categories:
  - input-validation
  applies_to:
    kind:
    - service
    services: &id001
    - kyc_service
    - support_console_api
    - merchant_portal_api
    - refund_service
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-434
  violation_scenarios:
  - Uploads are accepted up to the limit of the web server, which is 200 MB.
  - The file type is decided by the extension in the file name.
  - Any content type is accepted because the files are only stored.
  - The size is checked in the browser only.
  - The allowed list exists, but the check reads the Content-Type header sent by the client.
  - Archives are accepted and unpacked without any limit on their size.
  how_to_omit: The size limit and the way the type of an uploaded file is checked.
  remediation_options:
