- id: API-01
  title: Input validation
  statement: All external inputs must be validated against a schema and rejected if invalid.
  categories:
  - input-validation
  applies_to:
    kind:
    - api_gateway
    - service
    exposure:
    - external
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-20
  violation_scenarios:
  - Request bodies are accepted as free-form JSON and handled as-is.
  - Validation happens in the client SDK only; the server trusts the payload.
  - The API accepts any JSON object and the service picks the fields it needs.
  - Only the presence of required fields is checked; types and sizes are not enforced.
  - The request model is a generic map and each handler reads what it wants.
  - Unknown fields are accepted and passed through to downstream services.
  how_to_omit: How incoming request data is validated.
  remediation_options:
  - - validate external inputs against a schema
    - reject invalid input
  implementation_check: openapi_freeform_body
  ambiguity_ok: true
- id: API-02
  title: Rate limiting
  statement: External APIs must enforce per-client rate limits.
  categories:
  - availability
  applies_to:
    kind:
    - api_gateway
    - service
    exposure:
    - external
  check_scope: both
  base_severity: 2
  cwe_ids:
  - CWE-770
  violation_scenarios:
  - Clients may call endpoints without any limit.
  - Rate limiting is left for a later release; there are no per-client limits at launch.
  - No quotas are applied so that large merchants are never throttled.
  - Throttling is handled by merchants themselves; the API does not limit them.
  - We expect partners to behave and therefore have no limits on request volume.
  - Limits would complicate the contract, so none are defined for now.
  how_to_omit: Limits on request volume per client.
  remediation_options:
  - - enforce per-client rate limits on external APIs
  implementation_check: openapi_rate_limit_absent
  ambiguity_ok: true
- id: API-03
  title: Signed webhooks
  statement: Outbound and inbound webhook payloads must be signed and signatures verified.
