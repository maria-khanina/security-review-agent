    - pii
  check_scope: both
  base_severity: 3
  cwe_ids:
  - CWE-200
  violation_scenarios:
  - Export files are left in a shared location with a permanent link.
  - Exported reports stay in the bucket forever and are shared through a link that never expires.
  - Reports are kept indefinitely so finance can download them any time, without expiry.
  - Report files remain in the storage bucket and are never deleted.
  - Exports are available through links that do not expire.
  - Finance can fetch reports of any past period at any time, as the files are kept for good.
  how_to_omit: Who can download exports and how long they remain available.
  remediation_options:
