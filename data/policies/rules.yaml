  implementation_check: null
  ambiguity_ok: true
- id: DATA-03
  title: Third-party data sharing
  statement: Personal data may be sent to third parties only under an approved data processing agreement and only the fields required.
  categories:
  - data-protection
  - privacy
  applies_to:
    kind:
    - third_party
    - service
    data:
    - pii
  check_scope: design
  base_severity: 3
  cwe_ids:
  - CWE-201
  violation_scenarios:
  - The entire customer record is forwarded to a vendor for convenience.
  - The vendor receives the complete profile, including fields it does not need, without a signed data processing agreement.
  - Customer data is shared with a new provider while the contract is still being negotiated.
  - Raw event payloads including personal data are sent to the analytics provider.
  - Contact details of all customers are shared with the marketing vendor.
  - Data is sent to a third party under a verbal agreement.
  how_to_omit: What data is shared with the vendor and under what agreement.
  remediation_options:
  - - share personal data with third parties only under an approved data processing agreement
    - send only the fields required
  implementation_check: null
  ambiguity_ok: true
- id: DATA-04
  title: No production data in test
  statement: Non-production environments must not contain real personal or card data.
  categories:
  - data-protection
  applies_to:
    kind:
    - database
    - service
  check_scope: design
  base_severity: 2
  cwe_ids:
  - CWE-359
  violation_scenarios:
  - Staging is refreshed nightly from a production snapshot.
  - Developers copy production data to their laptops to reproduce bugs.
  - The test environment is seeded with a real customer export.
  - The sandbox environment uses a nightly copy of production for realistic testing.
  - Support analysts reproduce issues in staging with real customer records.
  - Load tests run against a restored production backup.
  how_to_omit: Source of data in test environments.
  remediation_options:
  - - keep real personal and card data out of non-production environments
  implementation_check: null
  ambiguity_ok: true
- id: DATA-05
  title: Protected exports
  statement: Reports and exports containing personal data must require authorization, be encrypted in storage and expire.
  categories:
  - data-protection
  - authorization
  applies_to:
    kind:
    - service
    - object_storage
    data:
    - pii
  check_scope: both
  base_severity: 3
  cwe_ids:
  - CWE-200
  violation_scenarios:
  - Export files are left in a shared location with a permanent link.
  - Exported reports stay in the bucket forever and are shared through a link that never expires.
  - Reports are kept indefinitely so finance can download them any time, without expiry.
  - Report files remain in the storage bucket and are never deleted.
  - Exports are available through links that do not expire.
  - Finance can fetch reports of any past period at any time, as the files are kept for good.
  how_to_omit: Who can download exports and how long they remain available.
  remediation_options:
  - - require authorization to access exports that contain personal data
